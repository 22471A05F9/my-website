<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  
  <style>
    
    nav {
      background-color: #2c3e50;
      padding: 15px;
      text-align: end;
      
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 18px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #f1c40f;
      text-decoration: underline;
    }

    
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-image: linear-gradient(lightblue);
      scrollbar-width: none;
    
    }

    
    section {
      padding: 40px;
      text-align: center;
    }

    section a {
      display: block;
      margin: 10px;
      font-size: 18px;
      text-decoration: none;
      transition: 0.3s;
    }

    section a:hover {
      opacity: 0.7;
    }

    
    form {
      max-width: 300px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: white;
    }

    label {
      display: block;
      margin-top: 10px;
      text-align: left;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 15px;
      box-sizing: border-box;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    
    footer {
      background-color: #2c3e50;
      padding: 20px;
      text-align: center;
    }

    footer a {
      color: white;
      margin: 0 15px;
      font-size: 30px;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: #f1c40f;
    }
  </style>
</head>

<body>

  
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="skills.html">Skills</a>
    <a href="project.html">Project</a>
  </nav>

  
  <section>
    <a href="https://www.google.com" target="_blank" style="color: blue;">Google Website</a>
    <a href="https://www.youtube.com" target="_blank" style="color: red;">YouTube Website</a>
    <a href="https://www.instagram.com" target="_blank" style="color: purple;">Instagram Website</a>
    <a href="https://www.amazon.com" target="_blank" style="color: green;">Amazon Website</a>

    <p style="font-size: 22px; font-weight: bold; color: darkblue; margin-top: 20px;">Welcome to the Contact Page</p>

    
    <form>
      <label>Username:</label>
      <input type="text" placeholder="Enter your username" required>

      <label>Email:</label>
      <input type="email" placeholder="Enter your email" required>

      <label>Message:</label>
      <textarea rows="4" placeholder="Purpose of contacting" required></textarea>

      <button type="submit">Submit</button>
    </form>
  </section>

  
  <footer>
    <div>
      <a href="https://www.linkedin.com" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
      <a href="https://www.instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
    </div>
    <p style="color: #ccc; margin-top: 10px; font-size: 14px;">© 2025 Mahesh's Website. All rights reserved.</p>
  </footer>

</body>
</html>
