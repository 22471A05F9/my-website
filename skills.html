<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills Page</title>
  <h1 class="name">Mahesh Babu Website</h1>


  <style>

.name{
      position: absolute;
      margin-top: 8px;
      margin-left: 30px;
      color: lightblue;
    }
    
    nav {
      background-color: #2c3e50;
      padding: 15px;
      text-align: right;
      scrollbar-width: none;
    
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 18px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #f1c40f;
      text-decoration: underline;
    }

    
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-image: linear-gradient(lightblue);
    }

    
    section {
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 40px;
      color: #2c3e50;
    }

    
    .skills-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
    }

    
    .skill-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      padding: 20px;
      width: 180px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }

    .skill-card:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .skill-card img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .skill-name {
      font-size: 20px;
      font-weight: bold;
      margin: 0;
    }

    
    .html { color: red; }
    .css { color: blue; }
    .fullstack { color: darkmagenta; }
    .javascript { color: chocolate; }

    
    @media (max-width: 768px) {
      .skills-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>

  
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="skills.html">Skills</a>
    <a href="project.html">Project</a>
    <a href="contact.html">Contact</a>
  </nav>

  
  <section>
    <h1>My Skills</h1>

    <div class="skills-container">

      <div class="skill-card">
        <img src="./Images/html.png" alt="HTML Logo">
        <p class="skill-name html">HTML</p>
      </div>

      <div class="skill-card">
        <img src="./Images/css.png" alt="CSS Logo">
        <p class="skill-name css">CSS</p>
      </div>

      <div class="skill-card">
        <img src="./Images/fullstack.png" alt="Fullstack Logo">
        <p class="skill-name fullstack">Fullstack</p>
      </div>

      <div class="skill-card">
        <img src="./Images/java.png" alt="JavaScript Logo">
        <p class="skill-name javascript">JavaScript</p>
      </div>

    </div>
  </section>

</body>
</html>
